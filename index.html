<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c0f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0f0a'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' font-family='system-ui' font-size='34' font-weight='900' fill='%23a8e063'%3ED%3C/text%3E%3Ctext x='72%25' y='55%25' font-family='system-ui' font-size='34' font-weight='900' fill='%23ff6b35'%3E.%3C/text%3E%3C/svg%3E" />
  <title>DIÁRIO.FIT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #0c0f0a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { overscroll-behavior-y: contain; }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a3520; border-radius: 3px; }
    /* Animations */
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .fadein { animation: fadein .3s ease; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    /* Loading */
    .app-loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #a8e063; font-size: 14px; letter-spacing: 2px; }
  </style>

  <!-- Libraries -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="root"><div class="app-loading">CARREGANDO...</div></div>

  <script type="text/babel" data-presets="react">
  const { useState, useEffect, useRef, useMemo } = React;

  // ==================== Constants ====================
  const DEFAULTS = {
    TDEE: 2600,
    TARGET: 2200,
    EK: 8,
    WEIGHT: 85,
    PROXY_URL: "https://diariofit-proxy.romarioproxxima.workers.dev",
    SYNC_URL: "",
    DEVICE_NAME: "",
    SHEET_PUB_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8B7ete3JubUTXNvQ_qfMySURPBBi9uPmBtYrguWJEbM61b3XAzB7SAuphq_jPTdUCQXCl0W3yy1GD",
    SHEET_GIDS: { Dias: 1169272171, Refeicoes: 285727567, Exercicios: 1103996178, Cardios: 889808136 },
    MEAL_NAMES: ["Café da manhã", "Lanche da manhã", "Almoço", "Lanche da tarde", "Jantar"],
    MEAL_TIMES: ["07h-08h", "10h", "11h-12h30", "16h", "19h-20h"],
  };

  const CK = { Corrida: 11, Ciclismo: 8, Caminhada: 5, HIIT: 14, "": 0 };
  const WD = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const MO = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  const PLAN = {
    0: { l: "Descanso", ex: [], s: "Caminhada leve 30-45min ou alongamento" },
    1: { l: "Treino 1 · Sup.A — Costas+Ombro+Bíceps", ex: [
      { n: "Cárdio aquecimento", s: "1 × 10min", k: 1 },
      { n: "Puxada Superior", s: "4 × 12", k: 4 },
      { n: "Rem. Peso Corp. Pronada", s: "4 × 15", k: 4 },
      { n: "Rem. Curvada c/ Halteres", s: "4 × 15", k: 4 },
      { n: "Desenv. c/ Halteres", s: "4 × 15", k: 4 },
      { n: "Elevação Lateral", s: "4 × 15", k: 4 },
      { n: "Rosca Scott", s: "4 × 15", k: 4 },
      { n: "Rosca Direta c/ Barra", s: "4 × 15", k: 4 },
    ], s: "Descanso 1min entre séries" },
    2: { l: "Treino 2 · Inf.A — Pernas+Panturrilha", ex: [
      { n: "Cárdio aquecimento", s: "1 × 10min", k: 1 },
      { n: "Cadeira Extensora", s: "4 × 15", k: 4 },
      { n: "Agachamento no Smith", s: "4 × 15", k: 4 },
      { n: "Leg Press 45°", s: "4 × 15", k: 4 },
      { n: "Mesa Flexora", s: "4 × 15", k: 4 },
      { n: "Cadeira Adutora", s: "4 × 15", k: 4 },
      { n: "Panturrilha em Pé", s: "4 × 20", k: 4 },
      { n: "Panturrilha Sentado", s: "4 × 20", k: 4 },
    ], s: "Descanso 1min entre séries" },
    3: { l: "Treino 3 · Sup.B — Costas+Peito+Tríceps", ex: [
      { n: "Cárdio aquecimento", s: "1 × 10min", k: 1 },
      { n: "Remada Sentado", s: "4 × 15", k: 4 },
      { n: "Pulldown c/ Triângulo", s: "4 × 12", k: 4 },
      { n: "Crucifixo Máquina", s: "4 × 15", k: 4 },
      { n: "Supino Inclinado Halteres", s: "4 × 12", k: 4 },
      { n: "Tríceps Corda", s: "4 × 15", k: 4 },
      { n: "Tríceps Francês", s: "4 × 12", k: 4 },
    ], s: "Descanso 1min entre séries" },
    4: { l: "Treino 4 · Inf.B — Glúteo+Posterior", ex: [
      { n: "Cárdio aquecimento", s: "1 × 10min", k: 1 },
      { n: "Cadeira Abdutora", s: "4 × 15", k: 4 },
      { n: "Glúteo na Polia", s: "4 × 15", k: 4 },
      { n: "Elevação Pélvica", s: "4 × 15", k: 4 },
      { n: "Stiff c/ Barra", s: "4 × 15", k: 4 },
      { n: "Mesa Flexora", s: "4 × 15", k: 4 },
      { n: "Agachamento Sumô", s: "4 × 15", k: 4 },
    ], s: "Descanso 1min entre séries" },
    5: { l: "Descanso ativo", ex: [], s: "Caminhada ou bike leve 30min" },
    6: { l: "Cardio Longo", ex: [], s: "Ciclismo 60-75min ou corrida 45min" },
  };

  const C = {
    bg: "#0c0f0a", s2: "#1c2416", a: "#a8e063", a2: "#5cb85c", a3: "#ff6b35",
    t: "#e8f0e0", m: "#6b7d5e", b: "#2a3520", c: "#181f12",
    red: "#e74c3c", blue: "#3498db", yellow: "#f5c518",
  };

  const EK = DEFAULTS.EK;

  // ==================== Utils ====================
  const fmtD = (d) => String(d.getDate()).padStart(2, "0") + " " + MO[d.getMonth()] + " " + d.getFullYear();
  const dkey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  function LS(k, v) {
    if (v === undefined) {
      try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; }
    } else {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {
        console.error("LS write failed", e);
      }
    }
  }

  function emptyM() {
    return [0, 1, 2, 3, 4].map(() => ({ hasPhoto: false, text: "", kcal: 0, analysis: null, done: false }));
  }

  function loadSettings() {
    const merged = { ...DEFAULTS, ...(LS("barriga_settings") || {}) };
    if (!merged.PROXY_URL || !merged.PROXY_URL.trim()) merged.PROXY_URL = DEFAULTS.PROXY_URL;
    // Migração: se localStorage tem só 4 refeições, expande para 5 (Lanche da manhã + Lanche da tarde)
    if (Array.isArray(merged.MEAL_NAMES) && merged.MEAL_NAMES.length < 5) {
      merged.MEAL_NAMES = [...DEFAULTS.MEAL_NAMES];
      merged.MEAL_TIMES = [...DEFAULTS.MEAL_TIMES];
    }
    return merged;
  }
  function saveSettings(s) { LS("barriga_settings", s); }

  function getDeviceId() {
    let id = LS("barriga_device_id");
    if (!id) {
      id = "d_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
      LS("barriga_device_id", id);
    }
    return id;
  }

  async function syncDay(dKey, settings) {
    if (!settings.SYNC_URL || !settings.SYNC_URL.trim()) return { ok: false, reason: "no_url" };
    const data = LS("diary_" + dKey);
    if (!data) return { ok: false, reason: "no_data" };
    const dow = new Date(dKey + "T12:00:00").getDay();
    const planEx = (PLAN[dow] || { ex: [] }).ex || [];
    const exS = data.exS || {};
    const exercises = [
      ...planEx.map((ex, i) => {
        const v = exS[i];
        const done = v === true ? ex.k : Math.max(0, Math.min(Number(v) || 0, ex.k));
        return { name: ex.n, vol: ex.s, sets_total: ex.k, sets_done: done, extra: false };
      }),
      ...((data.extraEx || []).map((ex) => {
        const v = ex.done;
        const k = ex.k || 4;
        const done = v === true ? k : Math.max(0, Math.min(Number(v) || 0, k));
        return { name: ex.n, vol: ex.s, sets_total: k, sets_done: done, extra: true };
      })),
    ];
    const meals = (data.meals || []).map((m, i) => {
      const a = m.analysis || {};
      return {
        idx: i,
        name: (settings.MEAL_NAMES[i] || ""),
        time: (settings.MEAL_TIMES[i] || ""),
        kcal: m.kcal || 0,
        foods: a.foods ? a.foods.join(", ") : "",
        p: Number(a.protein_g) || 0,
        c: Number(a.carb_g) || 0,
        g: Number(a.fat_g) || 0,
        text: m.text || "",
        assessment: a.assessment || "",
        tip: a.tip || "",
      };
    });
    const cardios = (data.cardios || []).map((c) => ({
      type: c.type || "",
      min: parseFloat(c.min) || 0,
      kcal: Math.round((CK[c.type] || 0) * (parseFloat(c.min) || 0)),
    }));
    const payload = {
      device_id: getDeviceId(),
      device_name: settings.DEVICE_NAME || "",
      date: dKey,
      weekday: data.weekday || "",
      label: data.label || "",
      consumed: data.consumed || 0,
      burned: data.burned || 0,
      deficit: data.deficit || 0,
      tdee: Number(settings.TDEE) || 0,
      target: Number(settings.TARGET) || 0,
      macros_p: (data.macros && data.macros.p) || 0,
      macros_c: (data.macros && data.macros.c) || 0,
      macros_g: (data.macros && data.macros.g) || 0,
      water: data.water || 0,
      notes: data.notes || "",
      saved: !!data.saved,
      meals, exercises, cardios,
      synced_at: new Date().toISOString(),
    };
    try {
      // text/plain pra evitar preflight CORS no Apps Script
      await fetch(settings.SYNC_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const synced = LS("barriga_synced") || {};
      synced[dKey] = Date.now();
      LS("barriga_synced", synced);
      const pending = LS("barriga_sync_pending") || {};
      delete pending[dKey];
      LS("barriga_sync_pending", pending);
      return { ok: true };
    } catch (e) {
      const pending = LS("barriga_sync_pending") || {};
      pending[dKey] = Date.now();
      LS("barriga_sync_pending", pending);
      return { ok: false, reason: "fetch_failed", error: String(e) };
    }
  }

  async function syncAllPending(settings) {
    const pending = LS("barriga_sync_pending") || {};
    const dates = Object.keys(pending);
    let ok = 0, fail = 0;
    for (const d of dates) {
      const r = await syncDay(d, settings);
      if (r.ok) ok++; else fail++;
    }
    return { ok, fail, total: dates.length };
  }

  async function syncAllHistory(settings) {
    const dates = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("diary_")) dates.push(k.replace("diary_", ""));
    }
    let ok = 0, fail = 0;
    for (const d of dates) {
      const r = await syncDay(d, settings);
      if (r.ok) ok++; else fail++;
    }
    return { ok, fail, total: dates.length };
  }

  // IndexedDB for photos (saves localStorage quota)
  const PHOTO_DB = "planobarriga_photos";
  const PHOTO_STORE = "photos";
  const photoStore = idbKeyval.createStore(PHOTO_DB, PHOTO_STORE);
  const photoKey = (dateKey, mealIdx) => `photo_${dateKey}_${mealIdx}`;

  async function savePhoto(k, data) { try { await idbKeyval.set(k, data, photoStore); } catch (e) { console.error(e); } }
  async function getPhoto(k) { try { return await idbKeyval.get(k, photoStore); } catch { return null; } }
  async function delPhoto(k) { try { await idbKeyval.del(k, photoStore); } catch {} }

  // Streak: consecutive days in deficit target
  function computeStreak() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let streak = 0;
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const data = LS("diary_" + dkey(d));
      if (!data || !data.saved) {
        if (i === 0) continue; // hoje pode não estar salvo ainda
        break;
      }
      const ok = data.deficit >= 200 && data.deficit <= 700;
      if (!ok) {
        if (i === 0) continue;
        break;
      }
      streak++;
    }
    return streak;
  }

  // Export / Import
  async function exportAll() {
    const data = { version: 2, ts: Date.now(), ls: {}, photos: {} };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith("diary_") || k.startsWith("barriga_"))) {
        data.ls[k] = LS(k);
      }
    }
    try {
      const keys = await idbKeyval.keys(photoStore);
      for (const k of keys) data.photos[k] = await idbKeyval.get(k, photoStore);
    } catch (e) { console.warn("no idb", e); }
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "plano-barriga-backup-" + dkey(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  async function importAll(file) {
    const txt = await file.text();
    const data = JSON.parse(txt);
    if (!data.ls) throw new Error("Arquivo inválido");
    for (const k in data.ls) LS(k, data.ls[k]);
    if (data.photos) {
      for (const k in data.photos) await idbKeyval.set(k, data.photos[k], photoStore);
    }
  }

  // ==================== Shared styles ====================
  const boxS = { background: C.c, border: "1px solid " + C.b, borderRadius: 14, padding: 16, marginBottom: 12 };
  const inpS = { width: "100%", background: C.s2, border: "1px solid " + C.b, borderRadius: 8, padding: "8px 10px", color: C.t, fontSize: 13, outline: "none" };
  const btnPrimary = (bg = C.a) => ({ width: "100%", padding: 12, background: bg, color: C.bg, border: "none", borderRadius: 10, fontWeight: 700, fontSize: 14, cursor: "pointer" });
  const chipS = (bg, color) => ({ fontSize: 10, padding: "3px 8px", borderRadius: 6, background: bg, color, fontWeight: 600 });

  // ==================== Rest Timer ====================
  function RestTimer({ onClose }) {
    const [secs, setSecs] = useState(60);
    const [running, setRunning] = useState(false);
    const [remaining, setRemaining] = useState(60);

    useEffect(() => {
      if (!running) return;
      const id = setInterval(() => {
        setRemaining((r) => {
          if (r <= 1) {
            clearInterval(id);
            setRunning(false);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            try { new AudioContext(); } catch {}
            return 0;
          }
          return r - 1;
        });
      }, 1000);
      return () => clearInterval(id);
    }, [running]);

    function start(s) { setSecs(s); setRemaining(s); setRunning(true); }
    function stop() { setRunning(false); setRemaining(secs); }

    return (
      <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: C.c, border: "1px solid " + C.a, borderRadius: 14, padding: 14, zIndex: 500, boxShadow: "0 10px 40px rgba(0,0,0,.6)", minWidth: 240 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <div style={{ fontSize: 11, color: C.m, letterSpacing: 1 }}>DESCANSO</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.m, fontSize: 18, cursor: "pointer" }}>×</button>
        </div>
        <div style={{ fontSize: 42, fontWeight: 900, color: remaining <= 10 && running ? C.a3 : C.a, textAlign: "center", fontVariantNumeric: "tabular-nums" }}>
          {String(Math.floor(remaining / 60)).padStart(2, "0")}:{String(remaining % 60).padStart(2, "0")}
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
          {[60, 90, 120].map((s) => (
            <button key={s} onClick={() => start(s)} style={{ flex: 1, padding: "7px 0", background: secs === s ? C.a : C.s2, color: secs === s ? C.bg : C.t, border: "none", borderRadius: 7, fontWeight: 600, fontSize: 12, cursor: "pointer" }}>{s}s</button>
          ))}
        </div>
        {running ? (
          <button onClick={stop} style={{ ...btnPrimary(C.a3), marginTop: 8, padding: 9, fontSize: 12 }}>PARAR</button>
        ) : (
          <button onClick={() => setRunning(true)} style={{ ...btnPrimary(C.a), marginTop: 8, padding: 9, fontSize: 12 }}>INICIAR {secs}s</button>
        )}
      </div>
    );
  }

  // ==================== Photo component ====================
  function MealPhoto({ dKey, mealIdx, hasPhoto, onChange }) {
    const [preview, setPreview] = useState(null);

    useEffect(() => {
      let cancelled = false;
      if (hasPhoto) {
        getPhoto(photoKey(dKey, mealIdx)).then((d) => {
          if (!cancelled) setPreview(d);
        });
      } else {
        setPreview(null);
      }
      return () => { cancelled = true; };
    }, [dKey, mealIdx, hasPhoto]);

    function handleFile(file) {
      if (!file) return;
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          const cv = document.createElement("canvas");
          const M = 450;
          let w = img.width, h = img.height;
          if (w > M) { h = Math.round(h * M / w); w = M; }
          if (h > M) { w = Math.round(w * M / h); h = M; }
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          const data = cv.toDataURL("image/jpeg", 0.65);
          await savePhoto(photoKey(dKey, mealIdx), data);
          setPreview(data);
          onChange(true);
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    }

    const camRef = useRef(null);
    const galRef = useRef(null);

    const btnS = {
      flex: 1, background: C.bg, border: "1px solid " + C.b, color: C.a,
      padding: "7px 8px", borderRadius: 7, fontSize: 11, fontWeight: 700,
      cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
    };

    return (
      <div style={{ border: "1.5px " + (hasPhoto ? "solid " + C.a2 : "dashed " + C.b), borderRadius: 9, marginBottom: 8, background: C.s2, overflow: "hidden" }}>
        {hasPhoto && preview ? (
          <div style={{ position: "relative" }}>
            <img src={preview} style={{ width: "100%", maxHeight: 160, objectFit: "cover", display: "block" }} alt="refeição" />
          </div>
        ) : (
          <div style={{ textAlign: "center", padding: "10px 8px 4px" }}>
            <div style={{ fontSize: 22 }}>📷</div>
            <div style={{ fontSize: 11, color: C.m, marginBottom: 4 }}>Adicionar foto da refeição</div>
          </div>
        )}
        <div style={{ display: "flex", gap: 6, padding: 6 }}>
          <button type="button" onClick={() => camRef.current && camRef.current.click()} style={btnS}>
            📷 {hasPhoto ? "Trocar (câmera)" : "Câmera"}
          </button>
          <button type="button" onClick={() => galRef.current && galRef.current.click()} style={btnS}>
            🖼 {hasPhoto ? "Trocar (galeria)" : "Galeria"}
          </button>
        </div>
        <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ""; }} />
        <input ref={galRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ""; }} />
      </div>
    );
  }

  // ==================== App ====================
  function App() {
    const [tab, setTab] = useState("diary");
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const [cur, setCur] = useState(today);
    const [settings, setSettings] = useState(loadSettings);
    const [exS, setExS] = useState({});
    const [extraEx, setExtraEx] = useState([]);
    const [meals, setMeals] = useState(emptyM());
    const [water, setWater] = useState(0);
    const [notes, setNotes] = useState("");
    const [cardios, setCardios] = useState([{ type: "", min: "" }]);
    const [analyzing, setAnalyzing] = useState(null);
    const [toast, setToast] = useState("");
    const [saved, setSaved] = useState(false);
    const [hist, setHist] = useState([]);
    const [prog, setProg] = useState([]);
    const [pf, setPf] = useState({ peso: "", cintura: "", abdomen: "", quadril: "" });
    const [restTimer, setRestTimer] = useState(false);
    const [streak, setStreak] = useState(0);

    const dow = cur.getDay();
    const plan = PLAN[dow];
    const dKey = dkey(cur);

    const consumed = meals.reduce((s, m) => s + (m.kcal || 0), 0);
    const setsDone = (v, k) => (v === true ? k : Math.max(0, Math.min(Number(v) || 0, k)));
    const burned = plan.ex.reduce((s, ex, i) => s + setsDone(exS[i], ex.k) * EK, 0)
      + (extraEx || []).reduce((s, ex) => s + setsDone(ex.done, ex.k || 4) * EK, 0)
      + (cardios || []).reduce((s, c) => s + Math.round((CK[c.type] || 0) * (parseFloat(c.min) || 0)), 0);
    const deficit = (settings.TDEE + burned) - consumed;
    const defOk = consumed > 0 && deficit >= 200 && deficit <= 700;
    const defOver = consumed > 0 && deficit < 200;

    // Aggregate macros
    const macros = meals.reduce((acc, m) => {
      if (m.analysis && !m.analysis.error) {
        acc.p += Number(m.analysis.protein_g) || 0;
        acc.c += Number(m.analysis.carb_g) || 0;
        acc.g += Number(m.analysis.fat_g) || 0;
      }
      return acc;
    }, { p: 0, c: 0, g: 0 });

    function showT(m) { setToast(m); setTimeout(() => setToast(""), 3000); }

    function upd(i, u) {
      setMeals((p) => { const m = [...p]; m[i] = { ...m[i], ...u }; return m; });
      setSaved(false);
    }

    // Load day data on date change
    useEffect(() => {
      const s = LS("diary_" + dKey) || {};
      setExS(s.exS || {});
      setExtraEx(Array.isArray(s.extraEx) ? s.extraEx : []);
      // Migra meals antigos: 4 refeições -> 5 (insere "Lanche da tarde" antes do Jantar)
      const sm = Array.isArray(s.meals) ? s.meals : null;
      if (sm && sm.length === 4) {
        const empty = { hasPhoto: false, text: "", kcal: 0, analysis: null, done: false };
        setMeals([sm[0], sm[1], sm[2], { ...empty }, sm[3]]);
      } else {
        setMeals(sm || emptyM());
      }
      setWater(s.water || 0);
      setNotes(s.notes || "");
      if (Array.isArray(s.cardios) && s.cardios.length > 0) {
        setCardios(s.cardios);
      } else if (s.ct || s.cm) {
        setCardios([{ type: s.ct || "", min: s.cm || "" }]);
      } else {
        setCardios([{ type: "", min: "" }]);
      }
      setSaved(!!s.saved);
    }, [dKey]);

    // Load history/progress when switching tabs
    useEffect(() => {
      if (tab === "hist") {
        const ks = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("diary_")) ks.push(k.replace("diary_", ""));
        }
        ks.sort((a, b) => b.localeCompare(a));
        setHist(ks.map((k) => ({ key: k, d: LS("diary_" + k) })).filter((x) => x.d && x.d.saved));
      }
      if (tab === "prog") setProg(LS("barriga_progress") || []);
    }, [tab]);

    // Auto-save: salva tudo automaticamente em qualquer mudança
    const prevDKeyRef = useRef("");
    useEffect(() => {
      // Pula o primeiro autosave após mudança de data (load ainda processando)
      if (prevDKeyRef.current !== dKey) {
        prevDKeyRef.current = dKey;
        return;
      }
      const hasContent = consumed > 0
        || meals.some((m) => (m.kcal || 0) > 0 || m.text || m.hasPhoto)
        || Object.values(exS).some((v) => v === true || (Number(v) || 0) > 0)
        || (extraEx || []).length > 0
        || (cardios || []).some((c) => c.type && (parseFloat(c.min) || 0) > 0)
        || (notes || "").length > 0
        || (water || 0) > 0;
      LS("diary_" + dKey, {
        saved: hasContent,
        exS, extraEx, meals, water, notes, cardios,
        ct: (cardios[0] && cardios[0].type) || "",
        cm: (cardios[0] && cardios[0].min) || "",
        weekday: WD[dow], label: plan.l,
        consumed, burned, deficit, macros,
      });
      if (hasContent !== saved) setSaved(hasContent);
      // Sync para nuvem (não bloqueia UI)
      if (settings.SYNC_URL && hasContent) {
        syncDay(dKey, settings);
      }
    }, [exS, extraEx, meals, water, notes, cardios, dKey]);

    // Recompute streak
    useEffect(() => { setStreak(computeStreak()); }, [saved, tab]);

    // Replay de syncs pendentes
    useEffect(() => {
      if (settings.SYNC_URL) {
        syncAllPending(settings).catch(() => {});
      }
    }, [settings.SYNC_URL]);

    // ==================== Analyze ====================
    async function analyze(i) {
      if (!settings.PROXY_URL) {
        showT("Configure URL do proxy em ⚙️");
        setTab("config");
        return;
      }
      const m = meals[i];
      if (!m.hasPhoto && !m.text) { showT("Adicione foto ou descrição"); return; }
      setAnalyzing(i);
      try {
        const content = [];
        if (m.hasPhoto) {
          const data = await getPhoto(photoKey(dKey, i));
          if (data) {
            content.push({
              type: "image",
              source: { type: "base64", media_type: "image/jpeg", data: data.split(",")[1] },
            });
          }
        }
        const mealName = settings.MEAL_NAMES[i] || ("Refeição " + (i + 1));
        content.push({
          type: "text",
          text: `Nutricionista: analise refeição "${mealName}" de pessoa ${settings.WEIGHT}kg, déficit alvo 400kcal, teto ${settings.TARGET}kcal.${m.text ? " Descrição: " + m.text : ""} Responda SOMENTE com JSON válido: {"foods":["item"],"kcal":400,"protein_g":30,"carb_g":40,"fat_g":15,"assessment":"ok","tip":"dica"}`,
        });
        const url = settings.PROXY_URL.replace(/\/$/, "") + "/v1/messages";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-haiku-4-5-20251001",
            max_tokens: 400,
            messages: [{ role: "user", content }],
          }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
        const raw = (data.content || []).map((c) => c.text || "").join("").trim();
        const match = raw.match(/\{[\s\S]*\}/);
        if (!match) throw new Error("JSON inválido na resposta");
        const p = JSON.parse(match[0]);
        upd(i, { kcal: Number(p.kcal) || 0, analysis: p });
        showT("Analisado: " + p.kcal + " kcal");
      } catch (e) {
        upd(i, { analysis: { error: e.message } });
        showT("Erro: " + e.message.substring(0, 50));
      } finally {
        setAnalyzing(null);
      }
    }

    // ==================== Save day ====================
    function saveDay() {
      LS("diary_" + dKey, {
        saved: true, exS, extraEx, meals, water, notes, cardios, ct: (cardios[0] && cardios[0].type) || "", cm: (cardios[0] && cardios[0].min) || "",
        weekday: WD[dow], label: plan.l,
        consumed, burned, deficit, macros,
      });
      setSaved(true);
      setStreak(computeStreak());
      showT("Dia salvo!");
    }

    function saveProg() {
      const { peso, cintura, abdomen, quadril } = pf;
      if (!peso && !cintura && !abdomen && !quadril) { showT("Preencha ao menos 1 campo"); return; }
      const h = LS("barriga_progress") || [];
      h.unshift({
        date: new Date().toLocaleDateString("pt-BR"),
        ts: Date.now(),
        peso: peso ? +peso : null,
        cintura: cintura ? +cintura : null,
        abdomen: abdomen ? +abdomen : null,
        quadril: quadril ? +quadril : null,
      });
      LS("barriga_progress", h);
      setProg(h);
      setPf({ peso: "", cintura: "", abdomen: "", quadril: "" });
      showT("Medidas salvas!");
    }

    function delProgEntry(idx) {
      if (!confirm("Apagar esse registro?")) return;
      const h = [...prog];
      h.splice(idx, 1);
      LS("barriga_progress", h);
      setProg(h);
    }

    const barColor = defOk ? C.a : defOver ? C.red : consumed > 0 ? C.blue : C.m;
    const tabS = (a) => ({
      padding: "8px 11px", borderRadius: "7px 7px 0 0", fontSize: 11, fontWeight: 500,
      cursor: "pointer", border: "none", background: a ? C.s2 : "transparent",
      color: a ? C.a : C.m, whiteSpace: "nowrap",
      borderBottom: a ? "2px solid " + C.a : "2px solid transparent",
    });

    return (
      <div style={{ background: C.bg, minHeight: "100vh", color: C.t, maxWidth: 480, margin: "0 auto", paddingBottom: 40 }}>
        {/* Header */}
        <div style={{ padding: "14px 18px 10px", borderBottom: "1px solid " + C.b, display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, background: C.bg, zIndex: 10 }}>
          <div style={{ fontSize: 20, fontWeight: 900, letterSpacing: 2, color: C.a }}>
            DIÁRIO<span style={{ color: C.a3 }}>.</span>FIT
          </div>
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            {streak > 0 && (
              <div style={{ ...chipS("#f5c51818", C.yellow), display: "flex", alignItems: "center", gap: 3, fontSize: 11 }}>
                🔥 {streak}
              </div>
            )}
            <div style={{ fontSize: 10, color: C.m, background: C.s2, border: "1px solid " + C.b, padding: "4px 10px", borderRadius: 20 }}>
              {fmtD(new Date())}
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", padding: "10px 12px 0", gap: 2, borderBottom: "1px solid " + C.b, overflowX: "auto" }}>
          {[["diary", "Diário"], ["hist", "Histórico"], ["plan", "Plano"], ["dash", "📊"], ["prog", "Progresso"], ["config", "⚙️"]].map(([id, lb]) => (
            <button key={id} onClick={() => setTab(id)} style={tabS(tab === id)}>{lb}</button>
          ))}
        </div>

        <div style={{ padding: 16 }}>
          {tab === "diary" && (
            <DiaryTab {...{
              cur, setCur, dow, plan, dKey,
              exS, setExS, extraEx, setExtraEx, meals, upd, water, setWater, notes, setNotes,
              cardios, setCardios, analyzing, analyze, saved, saveDay,
              consumed, burned, deficit, defOk, defOver, barColor, macros, settings,
              setSaved, setRestTimer,
            }} />
          )}
          {tab === "hist" && <HistoryTab hist={hist} />}
          {tab === "plan" && <PlanTab />}
          {tab === "dash" && <DashboardTab settings={settings} />}
          {tab === "prog" && <ProgressTab {...{ pf, setPf, saveProg, prog, delProgEntry }} />}
          {tab === "config" && <ConfigTab settings={settings} setSettings={(s) => { setSettings(s); saveSettings(s); }} showT={showT} />}
        </div>

        {toast && (
          <div style={{ position: "fixed", bottom: 18, left: "50%", transform: "translateX(-50%)", background: C.a, color: C.bg, padding: "9px 18px", borderRadius: 10, fontWeight: 600, fontSize: 12, zIndex: 999, whiteSpace: "nowrap", maxWidth: "85vw", textAlign: "center" }}>
            {toast}
          </div>
        )}

        {restTimer && <RestTimer onClose={() => setRestTimer(false)} />}
      </div>
    );
  }

  // ==================== Diary Tab ====================
  function DiaryTab(p) {
    const s = p.settings;
    return (
      <div>
        <div style={{ fontSize: 22, fontWeight: 900, color: C.t, marginBottom: 12 }}>DIÁRIO DO DIA</div>

        {/* Date navigator */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, background: C.c, border: "1px solid " + C.b, borderRadius: 12, padding: "10px 14px" }}>
          <button onClick={() => { const d = new Date(p.cur); d.setDate(d.getDate() - 1); p.setCur(d); }} style={{ background: C.s2, border: "1px solid " + C.b, color: C.t, width: 32, height: 32, borderRadius: 8, fontSize: 16, cursor: "pointer" }}>‹</button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 16, fontWeight: 900, color: C.a }}>{fmtD(p.cur)}</div>
            <div style={{ fontSize: 10, color: C.m }}>{WD[p.dow]}</div>
          </div>
          <button onClick={() => { const d = new Date(p.cur); d.setDate(d.getDate() + 1); p.setCur(d); }} style={{ background: C.s2, border: "1px solid " + C.b, color: C.t, width: 32, height: 32, borderRadius: 8, fontSize: 16, cursor: "pointer" }}>›</button>
        </div>

        {/* Balance */}
        <div style={boxS}>
          <div style={{ fontSize: 11, color: C.m, marginBottom: 10, letterSpacing: 1 }}>BALANÇO CALÓRICO</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
            {[[p.consumed, C.a3, "Consumido"], [p.burned, C.blue, "Queimado"], [p.consumed > 0 ? Math.abs(p.deficit) : "?", C.a, p.deficit < 0 ? "Superávit" : "Déficit"]].map(([v, c, l]) => (
              <div key={l} style={{ background: C.s2, borderRadius: 10, padding: "9px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 900, color: c, lineHeight: 1 }}>{v}</div>
                <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginTop: 2, letterSpacing: 0.5 }}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{ background: C.s2, borderRadius: 20, height: 8, overflow: "hidden", marginBottom: 7 }}>
            <div style={{ width: p.consumed > 0 ? Math.min((p.consumed / s.TARGET) * 100, 100) + "%" : "0%", height: "100%", borderRadius: 20, background: p.barColor, transition: "width .5s" }} />
          </div>
          <div style={{ fontSize: 12, textAlign: "center", padding: "7px 10px", borderRadius: 9, background: p.defOk ? "#a8e06318" : p.defOver ? "#e74c3c18" : p.consumed > 0 ? "#3498db18" : C.s2, color: p.defOk ? C.a : p.defOver ? C.red : p.consumed > 0 ? C.blue : C.m }}>
            {p.consumed === 0 ? "Analise refeições para calcular" : p.defOk ? "Déficit " + p.deficit + " kcal — no alvo!" : p.defOver ? (p.deficit < 0 ? "Superávit " + Math.abs(p.deficit) + " kcal" : "Déficit baixo " + p.deficit + " kcal") : "Déficit alto " + p.deficit + " kcal"}
          </div>

          {/* Macros agregados */}
          {(p.macros.p > 0 || p.macros.c > 0 || p.macros.g > 0) && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginTop: 10 }}>
              {[["P", "Proteína", p.macros.p, "#e74c3c"], ["C", "Carbo", p.macros.c, "#f5c518"], ["G", "Gordura", p.macros.g, "#3498db"]].map(([k, n, v, c]) => (
                <div key={k} style={{ background: C.s2, borderRadius: 8, padding: "6px 4px", textAlign: "center" }}>
                  <div style={{ fontSize: 14, fontWeight: 900, color: c }}>{Math.round(v)}g</div>
                  <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase" }}>{n}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Training */}
        <div style={boxS}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.t }}>MUSCULAÇÃO — {p.plan.l}</div>
            {p.plan.ex.length > 0 && (
              <button onClick={() => p.setRestTimer(true)} style={{ background: C.s2, border: "1px solid " + C.b, color: C.a, padding: "5px 10px", borderRadius: 7, fontSize: 11, cursor: "pointer" }}>⏱ Descanso</button>
            )}
          </div>
          {p.plan.ex.length === 0 && p.extraEx.length === 0 ? (
            <div style={{ fontSize: 12, color: C.m, marginBottom: 8 }}>Sem musculação hoje (adicione exercícios avulsos abaixo se quiser)</div>
          ) : (
            <div style={{ marginBottom: 10 }}>
              {p.plan.ex.map((ex, i) => {
                const v = p.exS[i];
                const doneN = (v === true ? ex.k : Math.max(0, Math.min(Number(v) || 0, ex.k)));
                const full = doneN === ex.k;
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: full ? "#a8e06310" : C.s2, border: "1px solid " + (full ? "#a8e06335" : C.b), borderRadius: 8, marginBottom: 4 }}>
                    <span style={{ fontSize: 12, flex: 1, textDecoration: full ? "line-through" : "none", color: full ? C.m : C.t }}>{ex.n}</span>
                    <span style={{ fontSize: 9, color: C.a, background: "#a8e06315", padding: "2px 6px", borderRadius: 4 }}>{ex.s}</span>
                    <select value={doneN} onChange={(e) => { const n = Number(e.target.value); p.setExS((prev) => ({ ...prev, [i]: n })); p.setSaved(false); }}
                      style={{ background: C.bg, color: doneN > 0 ? C.a : C.m, border: "1px solid " + C.b, borderRadius: 6, padding: "3px 5px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                      {Array.from({ length: ex.k + 1 }, (_, n) => <option key={n} value={n}>{n}/{ex.k}</option>)}
                    </select>
                  </div>
                );
              })}
              {p.extraEx.map((ex, i) => {
                const v = ex.done;
                const k = ex.k || 4;
                const doneN = (v === true ? k : Math.max(0, Math.min(Number(v) || 0, k)));
                const full = doneN === k;
                return (
                  <div key={"x" + i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: full ? "#ff6b3510" : C.s2, border: "1px solid " + (full ? "#ff6b3535" : C.b), borderRadius: 8, marginBottom: 4 }}>
                    <span style={{ fontSize: 12, flex: 1, textDecoration: full ? "line-through" : "none", color: full ? C.m : C.t }}>{ex.n}</span>
                    <span style={{ fontSize: 9, color: C.a3, background: "#ff6b3515", padding: "2px 6px", borderRadius: 4 }}>{ex.s}</span>
                    <select value={doneN} onChange={(e) => { const n = Number(e.target.value); p.setExtraEx((prev) => prev.map((x, j) => j === i ? { ...x, done: n } : x)); p.setSaved(false); }}
                      style={{ background: C.bg, color: doneN > 0 ? C.a3 : C.m, border: "1px solid " + C.b, borderRadius: 6, padding: "3px 5px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                      {Array.from({ length: k + 1 }, (_, n) => <option key={n} value={n}>{n}/{k}</option>)}
                    </select>
                    <button onClick={() => { p.setExtraEx((prev) => prev.filter((_, j) => j !== i)); p.setSaved(false); }}
                      style={{ background: "none", border: "none", color: C.m, fontSize: 15, cursor: "pointer", padding: "0 2px" }}>×</button>
                  </div>
                );
              })}
            </div>
          )}
          <ExerciseFromPlanPicker onAdd={(ex) => { p.setExtraEx((prev) => [...prev, ex]); p.setSaved(false); }} />
          <AddExerciseForm onAdd={(ex) => { p.setExtraEx((prev) => [...prev, ex]); p.setSaved(false); }} />
          <div style={{ fontSize: 13, fontWeight: 700, color: C.t, marginBottom: 6 }}>CARDIO</div>
          <div style={{ fontSize: 11, color: C.m, marginBottom: 8, padding: "6px 9px", background: C.s2, borderRadius: 7, borderLeft: "3px solid " + C.a2 }}>{p.plan.s}</div>
          {(p.cardios || []).map((c, i) => {
            const kcalC = Math.round((CK[c.type] || 0) * (parseFloat(c.min) || 0));
            return (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 22px", gap: 6, marginBottom: 6, alignItems: "end" }}>
                <div>
                  {i === 0 && <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginBottom: 3 }}>Tipo</div>}
                  <select value={c.type} onChange={(e) => {
                    const v = e.target.value;
                    p.setCardios((prev) => prev.map((x, j) => j === i ? { ...x, type: v } : x));
                    p.setSaved(false);
                  }} style={inpS}>
                    {["", "Corrida", "Ciclismo", "Caminhada", "HIIT"].map((o) => <option key={o} value={o}>{o || "Sem cardio"}</option>)}
                  </select>
                </div>
                <div>
                  {i === 0 && <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginBottom: 3 }}>Duração (min)</div>}
                  <input type="number" value={c.min} onChange={(e) => {
                    const v = e.target.value;
                    p.setCardios((prev) => prev.map((x, j) => j === i ? { ...x, min: v } : x));
                    p.setSaved(false);
                  }} placeholder="30" style={inpS} />
                </div>
                <button type="button" onClick={() => {
                  p.setCardios((prev) => prev.length > 1 ? prev.filter((_, j) => j !== i) : [{ type: "", min: "" }]);
                  p.setSaved(false);
                }} title="Remover" style={{ background: "none", border: "none", color: C.m, fontSize: 16, cursor: "pointer", padding: 0, height: 30 }}>×</button>
                {kcalC > 0 && (
                  <div style={{ gridColumn: "1 / -1", fontSize: 10, color: C.blue, marginTop: -2 }}>
                    +{kcalC} kcal
                  </div>
                )}
              </div>
            );
          })}
          <button type="button" onClick={() => { p.setCardios((prev) => [...prev, { type: "", min: "" }]); p.setSaved(false); }}
            style={{ width: "100%", background: C.s2, border: "1px dashed " + C.b, color: C.a, padding: "6px 10px", borderRadius: 7, fontSize: 11, fontWeight: 700, cursor: "pointer", marginTop: 4 }}>
            + Adicionar cardio
          </button>
        </div>

        {/* Meals */}
        <div style={boxS}>
          <div style={{ fontSize: 14, fontWeight: 700, color: C.t, marginBottom: 10 }}>REFEIÇÕES</div>
          {p.meals.map((meal, i) => (
            <div key={i} style={{ marginBottom: 10, border: "1px solid " + C.b, borderRadius: 10, overflow: "hidden" }}>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", background: C.s2 }}>
                <span style={{ fontSize: 12, fontWeight: 600 }}>{s.MEAL_NAMES[i]}</span>
                <span style={{ fontSize: 10, color: C.m }}>{s.MEAL_TIMES[i]}</span>
              </div>
              <div style={{ padding: "10px 12px" }}>
                <div style={{ marginBottom: 8 }}>
                  <span style={{ fontSize: 11, padding: "3px 9px", borderRadius: 7, background: meal.kcal ? "#a8e06318" : "#ff6b3515", color: meal.kcal ? C.a : C.a3, border: "1px solid " + (meal.kcal ? "#a8e06335" : "#ff6b3530") }}>
                    {meal.kcal ? meal.kcal + " kcal" : "? kcal"}
                  </span>
                </div>
                <MealPhoto dKey={p.dKey} mealIdx={i} hasPhoto={meal.hasPhoto} onChange={(v) => p.upd(i, { hasPhoto: v })} />
                <textarea value={meal.text} onChange={(e) => p.upd(i, { text: e.target.value })} placeholder="Descreva (opcional se tiver foto)..."

  // ==================== Dashboard Tab ====================
  function DashboardTab({ settings }) {
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState("");
    const [data, setData] = useState({ Dias: [], Refeicoes: [], Exercicios: [], Cardios: [] });
    const [device, setDevice] = useState("");
    const [period, setPeriod] = useState("14");
    const [updated, setUpdated] = useState("");
    const refBalanco = useRef(null);
    const refMacros = useRef(null);
    const refTrain = useRef(null);
    const chartsRef = useRef({});

    function fetchOne(name, gid) {
      const url = settings.SHEET_PUB_URL + "/pub?gid=" + gid + "&single=true&output=csv&_=" + Date.now();
      return fetch(url).then((r) => r.text()).then((t) => {
        const parsed = window.Papa.parse(t, { header: true, skipEmptyLines: true });
        return parsed.data.map((row) => {
          for (const k of Object.keys(row)) {
            const v = row[k];
            if (typeof v === "string" && /^-?\d+([.,]\d+)?$/.test(v.trim())) {
              row[k] = parseFloat(v.replace(",", "."));
            }
          }
          return row;
        });
      });
    }

    async function loadAll() {
      if (!settings.SHEET_PUB_URL) {
        setError("Configure a URL pública da planilha em ⚙️");
        setLoading(false);
        return;
      }
      if (!window.Papa) {
        setError("Carregando biblioteca... aguarde 2s e clique em ↻");
        setLoading(false);
        return;
      }
      setLoading(true);
      setError("");
      try {
        const gids = settings.SHEET_GIDS || { Dias: 1169272171, Refeicoes: 285727567, Exercicios: 1103996178, Cardios: 889808136 };
        const [d, r, e, c] = await Promise.all([
          fetchOne("Dias", gids.Dias),
          fetchOne("Refeicoes", gids.Refeicoes),
          fetchOne("Exercicios", gids.Exercicios),
          fetchOne("Cardios", gids.Cardios),
        ]);
        const noTest = (a) => a.filter((x) => x.date && !String(x.device_id || "").startsWith("test"));
        setData({
          Dias: noTest(d), Refeicoes: noTest(r),
          Exercicios: noTest(e), Cardios: noTest(c),
        });
        setUpdated(new Date().toLocaleString("pt-BR"));
      } catch (err) {
        setError("Erro: " + (err && err.message ? err.message : String(err)));
      } finally {
        setLoading(false);
      }
    }

    useEffect(() => { loadAll(); /* eslint-disable-next-line */ }, []);

    const filtered = useMemo(() => {
      let dates = [...new Set(data.Dias.map((d) => d.date))].sort();
      if (period !== "all") dates = dates.slice(-parseInt(period, 10));
      const dateSet = new Set(dates);
      const filt = (arr) => arr.filter((x) =>
        dateSet.has(x.date) && (!device || x.device_name === device)
      );
      return {
        dates,
        dias: filt(data.Dias), refeicoes: filt(data.Refeicoes),
        exercicios: filt(data.Exercicios), cardios: filt(data.Cardios),
      };
    }, [data, device, period]);

    function avg(arr) {
      const v = arr.filter((x) => typeof x === "number" && !isNaN(x));
      return v.length === 0 ? 0 : v.reduce((s, x) => s + x, 0) / v.length;
    }

    const f = filtered;
    const consumedAvg = avg(f.dias.map((x) => x.consumed));
    const burnedAvg = avg(f.dias.map((x) => x.burned));
    const deficitAvg = avg(f.dias.map((x) => x.deficit));
    const daysSaved = f.dias.filter((x) => x.saved === "sim" || x.saved === true).length;
    const totalDays = f.dates.length;
    const totalSets = f.exercicios.reduce((s, x) => s + (Number(x.sets_total) || 0), 0);
    const doneSets = f.exercicios.reduce((s, x) => s + (Number(x.sets_done) || 0), 0);
    const trainPct = totalSets > 0 ? Math.round(doneSets * 100 / totalSets) : 0;
    const cardioMin = f.cardios.reduce((s, x) => s + (Number(x.min) || 0), 0);
    const cardioKcal = f.cardios.reduce((s, x) => s + (Number(x.kcal) || 0), 0);
    const pAvg = avg(f.dias.map((x) => x.p));
    const cAvg = avg(f.dias.map((x) => x.c));
    const gAvg = avg(f.dias.map((x) => x.g));
    const devices = [...new Set(data.Dias.map((d) => d.device_name).filter((x) => x))];

    // Charts
    useEffect(() => {
      function destroy(k) { if (chartsRef.current[k]) { chartsRef.current[k].destroy(); delete chartsRef.current[k]; } }
      function theme() {
        return {
          plugins: { legend: { labels: { color: C.t, font: { size: 10 } } }, tooltip: { backgroundColor: C.c, borderColor: C.b, borderWidth: 1 } },
          scales: { x: { ticks: { color: C.m, font: { size: 9 } }, grid: { color: C.b + "55" } }, y: { ticks: { color: C.m, font: { size: 9 } }, grid: { color: C.b + "55" } } },
          responsive: true, maintainAspectRatio: false,
        };
      }
      if (refBalanco.current && f.dates.length > 0) {
        destroy("balanco");
        const byDate = {};
        f.dias.forEach((d) => {
          if (!byDate[d.date]) byDate[d.date] = { c: 0, b: 0, dt: 0, n: 0 };
          byDate[d.date].c += Number(d.consumed) || 0;
          byDate[d.date].b += Number(d.burned) || 0;
          byDate[d.date].dt += Number(d.deficit) || 0;
          byDate[d.date].n++;
        });
        const labels = f.dates.map((d) => d.slice(5));
        chartsRef.current.balanco = new Chart(refBalanco.current, {
          type: "bar",
          data: { labels, datasets: [
            { label: "Consumido", data: f.dates.map((d) => byDate[d] ? byDate[d].c / byDate[d].n : 0), backgroundColor: C.a3 },
            { label: "Queimado", data: f.dates.map((d) => byDate[d] ? byDate[d].b / byDate[d].n : 0), backgroundColor: C.blue },
            { label: "Déficit", data: f.dates.map((d) => byDate[d] ? byDate[d].dt / byDate[d].n : 0), backgroundColor: C.a, type: "line", borderColor: C.a, tension: 0.3 },
          ] },
          options: theme(),
        });
      }
      if (refMacros.current) {
        destroy("macros");
        chartsRef.current.macros = new Chart(refMacros.current, {
          type: "doughnut",
          data: { labels: ["Proteína " + Math.round(pAvg) + "g", "Carbo " + Math.round(cAvg) + "g", "Gordura " + Math.round(gAvg) + "g"],
            datasets: [{ data: [pAvg, cAvg, gAvg], backgroundColor: [C.red, C.yellow, C.blue] }] },
          options: { plugins: { legend: { labels: { color: C.t, font: { size: 10 } } } }, responsive: true, maintainAspectRatio: false },
        });
      }
      if (refTrain.current && f.dates.length > 0) {
        destroy("train");
        const byDate = {};
        f.exercicios.forEach((x) => {
          if (!byDate[x.date]) byDate[x.date] = { tot: 0, done: 0 };
          byDate[x.date].tot += Number(x.sets_total) || 0;
          byDate[x.date].done += Number(x.sets_done) || 0;
        });
        const labels = f.dates.map((d) => d.slice(5));
        const pct = f.dates.map((d) => byDate[d] && byDate[d].tot > 0 ? Math.round(byDate[d].done * 100 / byDate[d].tot) : 0);
        chartsRef.current.train = new Chart(refTrain.current, {
          type: "bar",
          data: { labels, datasets: [{ label: "% séries feitas", data: pct,
            backgroundColor: pct.map((v) => v >= 80 ? C.a : v >= 50 ? C.yellow : v > 0 ? C.a3 : C.b) }] },
          options: { ...theme(), scales: { ...theme().scales, y: { ...theme().scales.y, max: 100, beginAtZero: true } } },
        });
      }
      return () => { Object.keys(chartsRef.current).forEach(destroy); };
    }, [f.dates.join(","), device, period]);

    const meals = f.refeicoes
      .filter((m) => Number(m.kcal) > 0 && m.assessment)
      .sort((a, b) => b.date.localeCompare(a.date) || (Number(a.idx) - Number(b.idx)))
      .slice(0, 8);

    const skipStats = {};
    f.exercicios.forEach((x) => {
      if (x.extra === "sim") return;
      const n = x.name;
      if (!skipStats[n]) skipStats[n] = { totalSets: 0, doneSets: 0, days: 0, daysAny: 0 };
      skipStats[n].days++;
      skipStats[n].totalSets += Number(x.sets_total) || 0;
      skipStats[n].doneSets += Number(x.sets_done) || 0;
      if ((Number(x.sets_done) || 0) > 0) skipStats[n].daysAny++;
    });
    const skipArr = Object.keys(skipStats).map((n) => ({
      name: n, days: skipStats[n].days, skipped: skipStats[n].days - skipStats[n].daysAny,
      pct: skipStats[n].totalSets > 0 ? Math.round(skipStats[n].doneSets * 100 / skipStats[n].totalSets) : 0,
    })).sort((a, b) => b.skipped - a.skipped || a.pct - b.pct).slice(0, 8);

    const wd = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
    const recentDays = [...f.dias].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);

    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 22, fontWeight: 900, color: C.t }}>📊 DASHBOARD</div>
          <button onClick={loadAll} style={{ background: C.a, color: C.bg, border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>↻</button>
        </div>
        {updated && <div style={{ fontSize: 9, color: C.m, marginBottom: 10 }}>Atualizado: {updated}</div>}
        {loading && <div style={{ textAlign: "center", padding: 30, color: C.m }}>Carregando dados...</div>}
        {error && <div style={{ background: "#e74c3c15", border: "1px solid " + C.red, color: C.red, padding: 10, borderRadius: 8, marginBottom: 10, fontSize: 11 }}>{error}</div>}

        {!loading && !error && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 10 }}>
              <select value={device} onChange={(e) => setDevice(e.target.value)} style={inpS}>
                <option value="">Todas pessoas</option>
                {devices.map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
              <select value={period} onChange={(e) => setPeriod(e.target.value)} style={inpS}>
                <option value="7">Últimos 7d</option>
                <option value="14">Últimos 14d</option>
                <option value="30">Últimos 30d</option>
                <option value="all">Tudo</option>
              </select>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginBottom: 10 }}>
              <div style={{ background: C.s2, borderRadius: 9, padding: "10px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 900, color: deficitAvg >= 200 && deficitAvg <= 700 ? C.a : deficitAvg < 0 ? C.red : C.yellow, lineHeight: 1 }}>{Math.round(deficitAvg)}</div>
                <div style={{ fontSize: 8, color: C.m, marginTop: 3, letterSpacing: 0.5 }}>DÉF MÉDIO</div>
              </div>
              <div style={{ background: C.s2, borderRadius: 9, padding: "10px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 900, color: trainPct >= 80 ? C.a : trainPct >= 50 ? C.yellow : C.red, lineHeight: 1 }}>{trainPct}%</div>
                <div style={{ fontSize: 8, color: C.m, marginTop: 3 }}>TREINO</div>
              </div>
              <div style={{ background: C.s2, borderRadius: 9, padding: "10px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 900, color: C.a, lineHeight: 1 }}>{daysSaved}/{totalDays}</div>
                <div style={{ fontSize: 8, color: C.m, marginTop: 3 }}>DIAS REG.</div>
              </div>
              <div style={{ background: C.s2, borderRadius: 9, padding: "10px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 900, color: C.a3, lineHeight: 1 }}>{Math.round(consumedAvg)}</div>
                <div style={{ fontSize: 8, color: C.m, marginTop: 3 }}>KCAL CONS</div>
              </div>
              <div style={{ background: C.s2, borderRadius: 9, padding: "10px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 900, color: C.blue, lineHeight: 1 }}>{Math.round(burnedAvg)}</div>
                <div style={{ fontSize: 8, color: C.m, marginTop: 3 }}>KCAL QUEIM</div>
              </div>
              <div style={{ background: C.s2, borderRadius: 9, padding: "10px 6px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 900, color: C.blue, lineHeight: 1 }}>{Math.round(cardioMin)}</div>
                <div style={{ fontSize: 8, color: C.m, marginTop: 3 }}>MIN CARDIO</div>
              </div>
            </div>

            <div style={boxS}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.a, marginBottom: 8, letterSpacing: 0.5 }}>BALANÇO POR DIA</div>
              <div style={{ height: 200, position: "relative" }}><canvas ref={refBalanco}></canvas></div>
            </div>

            <div style={boxS}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.a, marginBottom: 8 }}>% TREINO COMPLETO POR DIA</div>
              <div style={{ height: 180, position: "relative" }}><canvas ref={refTrain}></canvas></div>
            </div>

            <div style={boxS}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.a, marginBottom: 8 }}>MACROS MÉDIOS</div>
              <div style={{ height: 200, position: "relative" }}><canvas ref={refMacros}></canvas></div>
            </div>

            <div style={boxS}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.a, marginBottom: 8 }}>HISTÓRICO RECENTE</div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", fontSize: 10, borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ color: C.m }}>
                      <th style={{ textAlign: "left", padding: 4 }}>Data</th>
                      <th style={{ textAlign: "left", padding: 4 }}>Treino</th>
                      <th style={{ textAlign: "right", padding: 4 }}>Cons</th>
                      <th style={{ textAlign: "right", padding: 4 }}>Quei</th>
                      <th style={{ textAlign: "right", padding: 4 }}>Déf</th>
                    </tr>
                  </thead>
                  <tbody>
                    {recentDays.map((d, i) => {
                      const dt = new Date(d.date + "T12:00:00");
                      const def = Number(d.deficit) || 0;
                      const col = def < 0 ? C.red : def >= 200 && def <= 700 ? C.a : C.blue;
                      return (
                        <tr key={i} style={{ borderTop: "1px solid " + C.b }}>
                          <td style={{ padding: 4 }}>{d.date.slice(5)} {wd[dt.getDay()]}</td>
                          <td style={{ padding: 4, color: C.m }}>{(d.label || "").substring(0, 18)}</td>
                          <td style={{ padding: 4, textAlign: "right", color: C.a3 }}>{Math.round(d.consumed) || "-"}</td>
                          <td style={{ padding: 4, textAlign: "right", color: C.blue }}>{Math.round(d.burned) || "-"}</td>
                          <td style={{ padding: 4, textAlign: "right", color: col, fontWeight: 700 }}>{Math.round(def)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {meals.length > 0 && (
              <div style={boxS}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.a, marginBottom: 8 }}>REFEIÇÕES — IA RECENTES</div>
                {meals.map((m, i) => {
                  const a = String(m.assessment || "").toLowerCase();
                  const cl = a.includes("ok") || a.includes("adequad") ? C.a : a.includes("inadeq") || a.includes("excess") || a.includes("acima") ? C.red : C.yellow;
                  return (
                    <div key={i} style={{ background: C.s2, borderRadius: 7, padding: 8, marginBottom: 5, fontSize: 11 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                        <strong>{m.date.slice(5)} · {m.name}</strong>
                        <span style={{ color: C.a, fontWeight: 700 }}>{Math.round(m.kcal)} kcal</span>
                      </div>
                      <div style={{ fontSize: 9, color: C.m, marginBottom: 3 }}>{m.foods}</div>
                      <span style={{ background: cl + "25", color: cl, padding: "1px 6px", borderRadius: 8, fontSize: 9, fontWeight: 700 }}>{m.assessment}</span>
                      {m.tip && <div style={{ fontSize: 9, color: C.m, marginTop: 4, lineHeight: 1.4 }}>{m.tip}</div>}
                    </div>
                  );
                })}
              </div>
            )}

            {skipArr.length > 0 && (
              <div style={boxS}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.a, marginBottom: 8 }}>EXERCÍCIOS MAIS PULADOS</div>
                <table style={{ width: "100%", fontSize: 10, borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ color: C.m }}>
                      <th style={{ textAlign: "left", padding: 4 }}>Exercício</th>
                      <th style={{ textAlign: "right", padding: 4 }}>Pulado</th>
                      <th style={{ textAlign: "right", padding: 4 }}>% feito</th>
                    </tr>
                  </thead>
                  <tbody>
                    {skipArr.map((x, i) => (
                      <tr key={i} style={{ borderTop: "1px solid " + C.b }}>
                        <td style={{ padding: 4 }}>{x.name}</td>
                        <td style={{ padding: 4, textAlign: "right" }}>{x.skipped}/{x.days}</td>
                        <td style={{ padding: 4, textAlign: "right", color: x.pct >= 80 ? C.a : x.pct >= 50 ? C.yellow : C.red, fontWeight: 700 }}>{x.pct}%</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // ==================== Progress Tab ====================
  function ProgressTab({ pf, setPf, saveProg, prog, delProgEntry }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);

    useEffect(() => {
      if (!canvasRef.current || prog.length < 2) {
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        return;
      }
      const ordered = [...prog].reverse();
      const labels = ordered.map((p) => p.date);
      const ds = [
        { label: "Peso (kg)", field: "peso", color: "#a8e063" },
        { label: "Cintura (cm)", field: "cintura", color: "#ff6b35" },
        { label: "Abdômen (cm)", field: "abdomen", color: "#f5c518" },
        { label: "Quadril (cm)", field: "quadril", color: "#3498db" },
      ].map((d) => ({
        label: d.label,
        data: ordered.map((p) => p[d.field]),
        borderColor: d.color,
        backgroundColor: d.color + "22",
        tension: 0.3,
        spanGaps: true,
        pointRadius: 3,
        pointBackgroundColor: d.color,
      }));

      if (chartRef.current) chartRef.current.destroy();
      chartRef.current = new Chart(canvasRef.current, {
        type: "line",
        data: { labels, datasets: ds },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: "#e8f0e0", font: { size: 10 }, boxWidth: 12 } },
            tooltip: { backgroundColor: "#181f12", borderColor: "#2a3520", borderWidth: 1 },
          },
          scales: {
            x: { ticks: { color: "#6b7d5e", font: { size: 9 } }, grid: { color: "#2a352055" } },
            y: { ticks: { color: "#6b7d5e", font: { size: 9 } }, grid: { color: "#2a352055" } },
          },
        },
      });
      return () => { if (chartRef.current) chartRef.current.destroy(); };
    }, [prog]);

    return (
      <div>
        <div style={{ fontSize: 22, fontWeight: 900, color: C.t, marginBottom: 12 }}>PROGRESSO</div>

        <div style={boxS}>
          <div style={{ fontSize: 14, fontWeight: 900, color: C.a, marginBottom: 10 }}>REGISTRAR MEDIDAS</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
            {[["peso", "Peso (kg)"], ["cintura", "Cintura (cm)"], ["abdomen", "Abdômen (cm)"], ["quadril", "Quadril (cm)"]].map(([f, l]) => (
              <div key={f}>
                <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginBottom: 3 }}>{l}</div>
                <input type="number" step="0.1" value={pf[f]} onChange={(e) => setPf((p) => ({ ...p, [f]: e.target.value }))} style={inpS} />
              </div>
            ))}
          </div>
          <button onClick={saveProg} style={btnPrimary(C.a)}>SALVAR MEDIDAS</button>
        </div>

        {prog.length >= 2 && (
          <div style={boxS}>
            <div style={{ fontSize: 14, fontWeight: 900, color: C.a, marginBottom: 10 }}>EVOLUÇÃO</div>
            <div style={{ height: 250 }}>
              <canvas ref={canvasRef} />
            </div>
          </div>
        )}

        <div style={{ fontSize: 17, fontWeight: 900, color: C.t, marginBottom: 10 }}>HISTÓRICO</div>
        {prog.length === 0 && <div style={{ textAlign: "center", color: C.m, padding: 30, border: "1px dashed " + C.b, borderRadius: 11 }}>Nenhum registro ainda.</div>}
        {prog.map((item, i) => {
          const prev = prog[i + 1];
          return (
            <div key={i} style={{ ...boxS, marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                <div style={{ fontSize: 10, color: C.m }}>📅 {item.date}</div>
                <button onClick={() => delProgEntry(i)} style={{ background: "none", border: "none", color: C.m, fontSize: 11, cursor: "pointer" }}>×</button>
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                {[["peso", "kg"], ["cintura", "cm"], ["abdomen", "cm"], ["quadril", "cm"]].map(([f, u]) => {
                  if (item[f] == null) return null;
                  const dv = prev && prev[f] != null ? item[f] - prev[f] : null;
                  return (
                    <div key={f} style={{ fontSize: 12 }}>
                      {f}: <strong style={{ color: C.a }}>{item[f]}{u}</strong>
                      {dv != null && <span style={{ fontSize: 9, padding: "1px 4px", borderRadius: 4, marginLeft: 2, background: dv < 0 ? "#a8e06318" : "#e74c3c15", color: dv < 0 ? C.a : C.red }}>{dv > 0 ? "+" : ""}{dv.toFixed(1)}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  // ==================== Config Tab ====================
  function ConfigTab({ settings, setSettings, showT }) {
    const [s, setS] = useState(settings);
    const fileRef = useRef(null);

    function update(k, v) { setS((p) => ({ ...p, [k]: v })); }
    function updateMeal(i, field, v) {
      setS((p) => {
        const next = { ...p };
        next[field] = [...p[field]];
        next[field][i] = v;
        return next;
      });
    }

    function save() {
      const clean = {
        ...s,
        TDEE: Number(s.TDEE) || DEFAULTS.TDEE,
        TARGET: Number(s.TARGET) || DEFAULTS.TARGET,
        WEIGHT: Number(s.WEIGHT) || DEFAULTS.WEIGHT,
        PROXY_URL: (s.PROXY_URL || "").trim(),
      };
      setSettings(clean);
      showT("Configurações salvas");
    }

    async function handleExport() {
      try { await exportAll(); showT("Backup baixado"); }
      catch (e) { showT("Erro: " + e.message); }
    }

    async function handleImport(file) {
      if (!file) return;
      if (!confirm("Importar vai sobrescrever dados atuais. Continuar?")) return;
      try {
        await importAll(file);
        showT("Importado! Recarregue.");
        setTimeout(() => location.reload(), 1200);
      } catch (e) { showT("Erro: " + e.message); }
    }

    function reset() {
      if (!confirm("Resetar TODAS as configurações ao padrão? (dados não serão apagados)")) return;
      setS(DEFAULTS);
      setSettings(DEFAULTS);
      showT("Configurações resetadas");
    }

    return (
      <div>
        <div style={{ fontSize: 22, fontWeight: 900, color: C.t, marginBottom: 12 }}>CONFIGURAÇÕES</div>

        <div style={boxS}>
          <div style={{ fontSize: 13, fontWeight: 900, color: C.a, marginBottom: 8 }}>MÉTRICAS</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            <div>
              <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginBottom: 3 }}>TDEE (kcal/dia)</div>
              <input type="number" value={s.TDEE} onChange={(e) => update("TDEE", e.target.value)} style={inpS} />
            </div>
            <div>
              <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginBottom: 3 }}>Meta (teto kcal)</div>
              <input type="number" value={s.TARGET} onChange={(e) => update("TARGET", e.target.value)} style={inpS} />
            </div>
            <div>
              <div style={{ fontSize: 9, color: C.m, textTransform: "uppercase", marginBottom: 3 }}>Peso atual (kg)</div>
              <input type="number" step="0.1" value={s.WEIGHT} onChange={(e) => update("WEIGHT", e.target.value)} style={inpS} />
            </div>
          </div>
          <div style={{ fontSize: 10, color: C.m, lineHeight: 1.5 }}>
            Déficit esperado: <strong style={{ color: C.a }}>{(Number(s.TDEE) || 0) - (Number(s.TARGET) || 0)} kcal/dia</strong>
            {" · "}~{(((Number(s.TDEE) || 0) - (Number(s.TARGET) || 0)) * 7 / 7700).toFixed(2)} kg/semana
          </div>
        </div>

        <div style={boxS}>
          <div style={{ fontSize: 13, fontWeight: 900, color: C.a, marginBottom: 8 }}>REFEIÇÕES</div>
          <div style={{ fontSize: 10, color: C.m, marginBottom: 8 }}>Ajuste nomes e horários conforme sua rotina.</div>
          {[0, 1, 2, 3, 4].map((i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 6, marginBottom: 6 }}>
              <input value={s.MEAL_NAMES[i]} onChange={(e) => updateMeal(i, "MEAL_NAMES", e.target.value)} style={inpS} />
              <input value={s.MEAL_TIMES[i]} onChange={(e) => updateMeal(i, "MEAL_TIMES", e.target.value)} style={inpS} placeholder="ex: 07h-08h" />
            </div>
          ))}
        </div>

        <div style={boxS}>
          <div style={{ fontSize: 13, fontWeight: 900, color: C.a, marginBottom: 8 }}>PROXY DA IA</div>
          <div style={{ fontSize: 10, color: C.m, marginBottom: 6 }}>
            URL do Cloudflare Worker. Deixa em branco pra desabilitar análise de IA.
          </div>
          <input value={s.PROXY_URL} onChange={(e) => update("PROXY_URL", e.target.value)} placeholder="https://plano-barriga-proxy.seudominio.workers.dev" style={inpS} />
          <div style={{ fontSize: 9, color: C.m, marginTop: 6 }}>Veja <strong>REVIEW.md</strong> para como publicar o proxy.</div>
        </div>

        <div style={boxS}>
          <div style={{ fontSize: 13, fontWeight: 900, color: C.a, marginBottom: 8 }}>SYNC NA NUVEM (Google Sheets)</div>
          <div style={{ fontSize: 10, color: C.m, marginBottom: 6 }}>
            URL do Apps Script (Web App). Sempre que salvar um dia, replica na sua planilha.
          </div>
          <input value={s.SYNC_URL || ""} onChange={(e) => update("SYNC_URL", e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" style={inpS} />
          <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: 10, color: C.m, marginBottom: 4 }}>NOME DESTE DEVICE (ex: "Romário", "Esposa")</div>
            <input value={s.DEVICE_NAME || ""} onChange={(e) => update("DEVICE_NAME", e.target.value)} placeholder="Romário" style={inpS} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 8 }}>
            <button type="button" onClick={async () => {
              if (!s.SYNC_URL) { showT("Configure a URL primeiro"); return; }
              showT("Sincronizando...");
              const r = await syncAllPending(s);
              showT("Pendentes: " + r.ok + "/" + r.total);
            }} style={{ background: C.s2, border: "1px solid " + C.b, color: C.a, padding: "8px 10px", borderRadius: 7, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
              ↻ Sincronizar pendentes
            </button>
            <button type="button" onClick={async () => {
              if (!s.SYNC_URL) { showT("Configure a URL primeiro"); return; }
              if (!confirm("Re-enviar TODOS os dias do histórico para a planilha?")) return;
              showT("Sincronizando histórico...");
              const r = await syncAllHistory(s);
              showT("Histórico: " + r.ok + "/" + r.total + " OK");
            }} style={{ background: C.s2, border: "1px solid " + C.b, color: C.t, padding: "8px 10px", borderRadius: 7, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
              ☁ Subir histórico todo
            </button>
          </div>
          <div style={{ fontSize: 9, color: C.m, marginTop: 6 }}>
            Veja o arquivo <strong>SYNC_SETUP.md</strong> no GitHub do projeto pro passo a passo de criar a planilha.
          </div>
        </div>

        <button onClick={save} style={btnPrimary(C.a)}>SALVAR CONFIGURAÇÕES</button>

        <div style={{ height: 18 }} />

        <div style={boxS}>
          <div style={{ fontSize: 13, fontWeight: 900, color: C.a, marginBottom: 8 }}>BACKUP</div>
          <div style={{ fontSize: 10, color: C.m, marginBottom: 10 }}>
            Exporta tudo (dados, fotos, medidas) num arquivo JSON pra você salvar.
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <button onClick={handleExport} style={{ ...btnPrimary(C.blue), padding: 10, fontSize: 12 }}>↓ EXPORTAR</button>
            <button onClick={() => fileRef.current.click()} style={{ ...btnPrimary(C.yellow), padding: 10, fontSize: 12 }}>↑ IMPORTAR</button>
            <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => handleImport(e.target.files[0])} />
          </div>
        </div>

        <button onClick={reset} style={{ ...btnPrimary(C.red), marginTop: 8, padding: 10, fontSize: 12 }}>RESETAR CONFIGURAÇÕES</button>

        <div style={{ marginTop: 20, textAlign: "center", fontSize: 10, color: C.m }}>
          DIÁRIO.FIT v2 · Dados 100% locais
        </div>
      </div>
    );
  }

  // ==================== Mount ====================
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    // Service Worker registration
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed:", e));
      });
    }
  </script>
</body>
</html>
